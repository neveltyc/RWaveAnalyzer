[package]
name = "rwave"
version = "0.2.0"
edition = "2024"
rust-version = "1.90.0"
authors = ["neveltyc"]
description = "AI-agent-friendly VCD/FST waveform analyzer for RTL debug, built on wellen."
repository = "https://github.com/neveltyc/RWaveAnalyzer"
license = "MIT"
keywords = ["vcd", "fst", "waveform", "rtl", "debug"]
readme = "../../README.md"

# A single binary named `rwave`.
[[bin]]
name = "rwave"
path = "src/main.rs"

# Built-in vendor-format backends. Both compile only on linux-x86_64 (the
# sole target the vendor libraries exist for); on any other target the
# feature is a no-op, so a default build there is pure VCD/FST/GHW. Disable
# with --no-default-features for a proprietary-free build on linux too.
[features]
default = ["wlf", "fsdb"]
wlf = []
fsdb = []

[dependencies]
# Waveform parsing front-end: vendored under vendor/wellen, pinned to 0.23.0.
wellen = { path = "../../vendor/wellen" }
# Direct FST access for the windowed (seek-by-time) decode path; same vendored
# copy wellen itself parses with, so both paths read identical bytes.
fst-reader = { workspace = true }
# Fast non-cryptographic hasher for the signal-table grouping map (SipHash
# dominated build time on large hierarchies). Same crate wellen already uses.
rustc-hash = { workspace = true }
# Runtime dynamic loading: external backends (RWAVE_PLUGIN_<EXT>) and the
# built-in backends' vendor libraries (libwlf / libNPI), all dlopened.
libloading = "0.8"

# Questa's post-simulation debug database (.dbg) is SQLite with a replaced
# 16-byte file header, and `trace` on a WLF reads its connectivity directly
# rather than asking `vsim` for it. Bundled, so the build does not depend on a
# system SQLite, and pinned exactly: the schema this reads is undocumented, so
# the reader is validated against one known-good stack rather than a range.
#
# This is the only C in the tree. It is not target-scoped: scoping it to the
# one target that ships the backend would also stop its tests compiling on a
# macOS dev machine, and all four release targets build it, including the
# musl-static arm64 one under crt-static, panic=abort and LTO.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "serialize"] }

[dev-dependencies]
